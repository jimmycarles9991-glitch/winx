# Hekate boot entry for the HAC-001-01 (Switch V2) WinX profile.
# Merge into bootloader/ini/ of your own HEKATE tree; do not remove any other OS entries.
# BL31/BL33 for this profile are built from the hac-v2-port branch and copied to:
#   switchroot/woa-hac-v2/bl31.bin
#   switchroot/woa-hac-v2/bl33.bin
[Windows 11 HAC V2]
l4t=1
boot_prefixes=switchroot/woa-hac-v2/
sld_type=1
ram_oc=1600000
